slug: moodle
name: Moodle (Quiz activity)
platform: standalone-web
homepage: https://moodle.org
repository: https://github.com/moodle/moodle
version_tested: "5.2.3"
affiliated: false
summary: >
  Moodle is a GPL learning management system whose core Quiz activity runs timed online
  exams from a shared question bank, with manual grading and item statistics. It suits
  schools and universities that already run, or are willing to run, a full LMS.

features:
  questions.question_type_count:
    value: 17
    note: Counted the 17 standard types listed in the 5.2 docs; this matches the 17 type folders in public/question/type (the internal missingtype excluded). Includes Description, which shows text and takes no answer.
    method: docs
    source_url: https://docs.moodle.org/502/en/Question_types
    verified_at: 2026-09-30

  questions.question_bank:
    value: "yes"
    note: Course shared question banks let a quiz use questions from any bank the teacher can access.
    method: docs
    source_url: https://docs.moodle.org/502/en/Question_bank
    verified_at: 2026-09-30

  questions.question_categories:
    value: "yes"
    note: Categories and subcategories, with a category filter in the bank. Tags are used when adding random questions.
    method: docs
    source_url: https://docs.moodle.org/502/en/Question_bank
    verified_at: 2026-09-30

  questions.random_from_pool:
    value: "yes"
    note: Add N random questions from a bank category, optionally filtered by tag.
    method: docs
    source_url: https://docs.moodle.org/502/en/Building_Quiz
    verified_at: 2026-09-30

  questions.math_formulas:
    value: "yes"
    note: The MathJax filter is enabled by default and renders TeX. The docs page does not mention MathML.
    method: docs
    source_url: https://docs.moodle.org/502/en/MathJax_filter
    verified_at: 2026-09-30

  questions.media_in_questions:
    value: "yes"
    note: TinyMCE, the default editor, inserts images, audio and video and can record audio and video clips.
    method: docs
    source_url: https://docs.moodle.org/502/en/TinyMCE_editor
    verified_at: 2026-09-30

  delivery.time_limit:
    value: "yes"
    note: When time expires, open attempts are submitted automatically by default. A grace period or "not counted" can be chosen instead.
    method: docs
    source_url: https://docs.moodle.org/502/en/Quiz_settings
    verified_at: 2026-09-30

  delivery.server_side_timer:
    value: "yes"
    note: process_attempt() compares the server time() with the attempt end time and ignores the client timer unless time is close to expiring. Expired attempts are also closed by handle_if_time_expired().
    method: source-code
    source_url: https://github.com/moodle/moodle/blob/v5.2.3/public/mod/quiz/classes/quiz_attempt.php#L2163-L2196
    verified_at: 2026-09-30

  delivery.shuffle_questions:
    value: "yes"
    note: Each quiz section has a Shuffle box for question order. Answer order is shuffled by a per-question setting (for example "Shuffle the choices" in multiple choice).
    method: docs
    source_url: https://docs.moodle.org/502/en/Building_Quiz
    verified_at: 2026-09-30

  delivery.attempt_limits:
    value: "yes"
    method: docs
    source_url: https://docs.moodle.org/502/en/Quiz_settings
    verified_at: 2026-09-30

  delivery.scheduling_windows:
    value: "yes"
    note: Open and close dates. After the closing time no new attempts can start.
    method: docs
    source_url: https://docs.moodle.org/502/en/Quiz_settings
    verified_at: 2026-09-30

  delivery.resume_after_disconnect:
    value: "yes"
    note: Starting the quiz again reopens the unfinished attempt instead of creating a new one. Answers are kept up to the last page change or autosave.
    method: source-code
    source_url: https://github.com/moodle/moodle/blob/v5.2.3/public/mod/quiz/startattempt.php#L103-L107
    verified_at: 2026-09-30

  delivery.lockdown_browser:
    value: "yes"
    note: Safe Exam Browser settings are built into the core quiz.
    method: docs
    source_url: https://docs.moodle.org/502/en/Safe_Exam_Browser
    verified_at: 2026-09-30

  delivery.ip_restriction:
    value: "yes"
    note: The "Require network address" setting takes a comma-separated list of full or partial IP addresses.
    method: docs
    source_url: https://docs.moodle.org/502/en/Quiz_settings
    verified_at: 2026-09-30

  proctoring.live_monitor:
    value: unverified

  proctoring.invigilator_role:
    value: unverified

  proctoring.extend_time_live:
    value: "yes"
    note: Done with a user override of the time limit. The end time is recomputed from the current limit on each request; the code notes the limit may change during an attempt.
    method: source-code
    source_url: https://github.com/moodle/moodle/blob/v5.2.3/public/mod/quiz/classes/quiz_attempt.php#L2173-L2178
    verified_at: 2026-09-30

  proctoring.webcam_proctoring:
    value: unverified

  proctoring.activity_log:
    value: unverified

  grading.auto_grading:
    value: "yes"
    method: docs
    source_url: https://docs.moodle.org/502/en/Quiz_grades_report
    verified_at: 2026-09-30

  grading.manual_grading:
    value: "yes"
    note: The grader enters a score and a comment for each essay response.
    method: docs
    source_url: https://docs.moodle.org/502/en/Essay_question_type
    verified_at: 2026-09-30

  grading.partial_credit:
    value: "yes"
    note: Each choice in a multiple-answer question carries a grade percentage.
    method: docs
    source_url: https://docs.moodle.org/502/en/Multiple_Choice_question_type
    verified_at: 2026-09-30

  grading.negative_marking:
    value: "yes"
    note: Choices can carry negative grade percentages.
    method: docs
    source_url: https://docs.moodle.org/502/en/Multiple_Choice_question_type
    verified_at: 2026-09-30

  grading.regrade:
    value: "yes"
    note: Regrade uses the current version of each question and has a dry-run option.
    method: docs
    source_url: https://docs.moodle.org/502/en/Quiz_grades_report
    verified_at: 2026-09-30

  grading.feedback_control:
    value: "yes"
    note: Review options set marks, right answers and feedback separately for immediately after the attempt, later while open, and after close.
    method: docs
    source_url: https://docs.moodle.org/502/en/Quiz_settings
    verified_at: 2026-09-30

  certificates.certificate_pdf:
    value: addon-free
    note: Needs the free third-party Custom certificate plugin (mod_customcert), which supports Moodle 5.2.
    method: docs
    source_url: https://docs.moodle.org/502/en/Custom_certificate_module
    verified_at: 2026-09-30

  certificates.certificate_designer:
    value: addon-free
    note: Custom certificate plugin (mod_customcert) lets staff add elements and reposition them by drag and drop.
    method: docs
    source_url: https://docs.moodle.org/502/en/Custom_certificate_module
    verified_at: 2026-09-30

  certificates.certificate_verification:
    value: addon-free
    note: Custom certificate plugin (mod_customcert) assigns a unique code; with a setting enabled, anyone with the link can verify it without logging in.
    method: docs
    source_url: https://docs.moodle.org/502/en/Custom_certificate_module
    verified_at: 2026-09-30

  reporting.results_export:
    value: "yes"
    note: The grades report table is downloadable through the core dataformat plugins, which include CSV, Excel and ODS.
    method: source-code
    source_url: https://github.com/moodle/moodle/blob/v5.2.3/public/mod/quiz/report/overview/report.php#L63-L72
    verified_at: 2026-09-30

  reporting.item_analysis:
    value: "yes"
    note: Statistics report gives facility index, standard deviation, discrimination index and discriminative efficiency.
    method: docs
    source_url: https://docs.moodle.org/502/en/Quiz_statistics_report
    verified_at: 2026-09-30

  reporting.candidate_report:
    value: "yes"
    note: The grades report links to a review of each attempt as the student would see it.
    method: docs
    source_url: https://docs.moodle.org/502/en/Quiz_grades_report
    verified_at: 2026-09-30

  standards.qti_import:
    value: partial
    note: The core Blackboard format accepts Blackboard POOL and QTI files. The docs name no general IMS QTI import or QTI version.
    method: docs
    source_url: https://docs.moodle.org/502/en/Import_questions
    verified_at: 2026-09-30

  standards.qti_export:
    value: "no"
    note: Export formats listed are Aiken, GIFT, Moodle XML and XHTML, plus contributed Word and HTML table plugins. No QTI.
    method: docs
    source_url: https://docs.moodle.org/502/en/Export_questions
    verified_at: 2026-09-30

  standards.other_import_formats:
    value: GIFT, Moodle XML, Aiken, Blackboard, Embedded answers (Cloze), Missing word
    note: Core formats only. H5P and Word table import need contributed plugins.
    method: docs
    source_url: https://docs.moodle.org/502/en/Import_questions
    verified_at: 2026-09-30

  standards.lti:
    value: "yes"
    note: Moodle can publish courses and activities as an LTI Advantage (1.3) tool; LTI 1.1 and 2.0 publishing is deprecated. Consumer role not checked here.
    method: docs
    source_url: https://docs.moodle.org/502/en/Publish_as_LTI_tool
    verified_at: 2026-09-30

  standards.scorm_xapi:
    value: unverified

  standards.rest_api:
    value: "yes"
    note: Web service framework with REST among the protocols; each site lists its functions under Site administration > Server > Web services > API Documentation.
    method: docs
    source_url: https://moodledev.io/docs/5.2/apis/subsystems/external
    verified_at: 2026-09-30

  access.wcag_statement:
    value: partial
    note: A WCAG 2.2 AA conformance report (October 2025) covers Moodle LMS, based on 20 sample LMS pages. It does not say whether quiz attempt pages were in the sample.
    method: docs
    source_url: https://docs.moodle.org/502/en/VPAT
    verified_at: 2026-09-30

  access.keyboard_only_exam:
    value: unverified

  access.rtl_support:
    value: unverified

  access.bundled_languages:
    value: 222
    note: Counted the .zip packs listed for 5.2, including regional and variant packs such as de_kids and en_us.
    method: docs
    source_url: https://download.moodle.org/langpack/5.2/
    verified_at: 2026-09-30

  access.accommodations:
    value: "yes"
    note: User and group overrides change time limit, close date, attempts allowed and password per student.
    method: docs
    source_url: https://docs.moodle.org/502/en/Quiz_overrides
    verified_at: 2026-09-30

  hosting.platform_requirement:
    value: none
    method: docs
    source_url: https://moodledev.io/general/releases/5.2
    verified_at: 2026-09-30

  hosting.runtime_stack:
    value: PHP 8.3+ (8.4 supported) with PostgreSQL 16+, MySQL 8.4+, MariaDB 10.11+, Aurora MySQL 8.0 or SQL Server 2019+
    method: docs
    source_url: https://moodledev.io/general/releases/5.2
    verified_at: 2026-09-30

  hosting.docker_image:
    value: "no"
    note: Moodle HQ publishes moodle-docker and the moodle-php-apache image for developers and testers. They provide a PHP runtime and mount the Moodle code; there is no official production image of Moodle.
    method: docs
    source_url: https://github.com/moodlehq/moodle-docker
    verified_at: 2026-09-30

  hosting.offline_mode:
    value: unverified

  hosting.mobile_friendly:
    value: unverified

  cost.license_spdx:
    value: GPL-3.0-or-later
    note: File headers state GPL version 3 or any later version; COPYING.txt holds the GPLv3 text.
    method: source-code
    source_url: https://github.com/moodle/moodle/blob/v5.2.3/public/version.php#L5-L8
    verified_at: 2026-09-30

  cost.price_model:
    value: free
    note: Release packages are downloadable without charge.
    method: docs
    source_url: https://download.moodle.org/releases/latest/
    verified_at: 2026-09-30

  cost.source_access:
    value: https://github.com/moodle/moodle
    method: source-code
    source_url: https://github.com/moodle/moodle/tree/v5.2.3
    verified_at: 2026-09-30
