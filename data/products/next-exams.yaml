slug: next-exams
name: Next Exams
platform: joomla
homepage: https://www.nextsoftware.dev/joomla-extensions/next-exams
version_tested: "6.1.0"
affiliated: true
summary: >
  Paid GPL exam component for Joomla 4.4, 5 and 6 with a question bank, random pools, server-side
  timing, essay marking, PDF certificates, live invigilation and LTI 1.3. Made by the maintainers
  of this comparison.

features:
  questions.question_type_count:
    value: 9
    note: Single and multiple choice, true/false, short answer, essay, ordering, matching, extended matching and cloze.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/question-bank
    verified_at: 2026-09-30

  questions.question_bank:
    value: yes
    note: Questions are stored apart from exams and exams reference them.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/question-bank
    verified_at: 2026-09-30

  questions.question_categories:
    value: yes
    note: Questions are filed in a subject tree and can carry tags; the bank can be filtered by subject, tag, type and state.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/question-bank
    verified_at: 2026-09-30

  questions.random_from_pool:
    value: yes
    note: A pool rule draws N questions from a subject or tag per attempt; fixed and pool questions can be mixed.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/exam-builder
    verified_at: 2026-09-30

  questions.math_formulas:
    value: yes
    note: LaTeX rendered with KaTeX in stems, options, explanations and results.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/question-bank
    verified_at: 2026-09-30

  questions.media_in_questions:
    value: partial
    note: The docs describe images only (PNG, JPEG, GIF, WebP, alt text required). Audio and video in questions are not documented.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/question-bank
    verified_at: 2026-09-30

  delivery.time_limit:
    value: yes
    note: Reaching zero submits the attempt automatically.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/exam-builder
    verified_at: 2026-09-30

  delivery.server_side_timer:
    value: yes
    note: The docs state the limit is enforced by the server and the browser countdown only displays the server clock. The runner also submits with JavaScript off.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/exam-runner
    verified_at: 2026-09-30

  delivery.shuffle_questions:
    value: yes
    note: Separate per-exam switches for question order and option order, fixed at attempt start.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/exam-builder
    verified_at: 2026-09-30

  delivery.attempt_limits:
    value: yes
    note: Maximum attempts and a cooldown between attempts; practice attempts are not counted.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/configuration/access-gates
    verified_at: 2026-09-30

  delivery.scheduling_windows:
    value: yes
    note: Open from and open until times per exam, plus per-cohort windows.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/configuration/access-gates
    verified_at: 2026-09-30

  delivery.resume_after_disconnect:
    value: yes
    note: Answers are autosaved; the examinee can return to the same attempt until the time limit, closing time or inactivity period is reached.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/faq
    verified_at: 2026-09-30

  delivery.lockdown_browser:
    value: unverified

  delivery.ip_restriction:
    value: unverified

  proctoring.live_monitor:
    value: yes
    note: The board polls the server on a set interval (3 to 300 seconds) and shows status, progress and time left per examinee.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/live-monitoring
    verified_at: 2026-09-30

  proctoring.invigilator_role:
    value: yes
    note: Roles grant actions per feature, so a role can hold only monitoring actions (extend time, pause, hand in). A proctor role is seeded. Accountless link or PIN grants are also available.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/configuration/roles-and-permissions
    verified_at: 2026-09-30

  proctoring.extend_time_live:
    value: yes
    note: Give more time to one examinee, or to everyone in the exam, from the live board.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/live-monitoring
    verified_at: 2026-09-30

  proctoring.webcam_proctoring:
    value: "no"
    note: The docs state webcam and video proctoring are out of scope and will not be added.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/integrity-signals
    verified_at: 2026-09-30

  proctoring.activity_log:
    value: partial
    note: Per attempt, staff see counts of focus loss, paste, tab switch and fullscreen exit, plus time to first answer per question, and a log of invigilator actions. There is no timestamped list of candidate events.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/integrity-signals
    verified_at: 2026-09-30

  grading.auto_grading:
    value: yes
    note: Eight of the nine types are scored at submission; essay is marked by hand.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/grading-and-results
    verified_at: 2026-09-30

  grading.manual_grading:
    value: yes
    note: Essays get points and feedback, optionally per rubric criterion.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/grading-and-results
    verified_at: 2026-09-30

  grading.partial_credit:
    value: yes
    note: Per question, all-or-nothing (default) or proportional, for multiple response, ordering, matching, extended matching and cloze.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/question-bank
    verified_at: 2026-09-30

  grading.negative_marking:
    value: unverified

  grading.regrade:
    value: unverified

  grading.feedback_control:
    value: yes
    note: Score release per exam is immediate, after close, at a set time or manual. Showing correct answers is a separate switch.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/grading-and-results
    verified_at: 2026-09-30

  certificates.certificate_pdf:
    value: yes
    note: Issued automatically on a pass when the exam has a certificate template; rendered by a bundled PDF engine.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/certificates
    verified_at: 2026-09-30

  certificates.certificate_designer:
    value: yes
    note: Visual editor with drag-placed elements, fonts, colours, background and merge tokens.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/certificates
    verified_at: 2026-09-30

  certificates.certificate_verification:
    value: yes
    note: QR code links to a public page keyed by a random token that shows valid, revoked or expired status.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/certificates
    verified_at: 2026-09-30

  reporting.results_export:
    value: yes
    note: Attempts export to CSV, filtered as on screen. No XLSX export is documented.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/analytics-and-reports
    verified_at: 2026-09-30

  reporting.item_analysis:
    value: yes
    note: Difficulty and item-total discrimination per question.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/analytics-and-reports
    verified_at: 2026-09-30

  reporting.candidate_report:
    value: partial
    note: The per-student report lists every attempt with scores over time. The docs do not state that it shows each answer and per-question timing.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/analytics-and-reports
    verified_at: 2026-09-30

  standards.qti_import:
    value: yes
    note: QTI 2.1.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/import-export
    verified_at: 2026-09-30

  standards.qti_export:
    value: yes
    note: QTI 2.1, with a vendor extension that carries the native answer key.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/import-export
    verified_at: 2026-09-30

  standards.other_import_formats:
    value: CSV (column mapping), Aiken, GIFT, Moodle XML
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/import-export
    verified_at: 2026-09-30

  standards.lti:
    value: yes
    note: LTI 1.3 tool provider with Deep Linking and score passback to the LMS gradebook.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/configuration/lti
    verified_at: 2026-09-30

  standards.scorm_xapi:
    value: unverified

  standards.rest_api:
    value: partial
    note: A bearer-token JSON API with scopes for subjects, questions, exams, attempts and reports is described. The public docs do not list its endpoints.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/configuration/api-tokens
    verified_at: 2026-09-30

  access.wcag_statement:
    value: yes
    note: Claims WCAG 2.1 AA for the exam-taking flow, based on the vendor's own testing; no third-party audit or VPAT.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/features/accessibility
    verified_at: 2026-09-30

  access.keyboard_only_exam:
    value: unverified

  access.rtl_support:
    value: unverified

  access.bundled_languages:
    value: 1
    note: English (en-GB) only; other languages need your own Joomla .ini files.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/faq
    verified_at: 2026-09-30

  access.accommodations:
    value: unverified

  hosting.platform_requirement:
    value: Joomla 4.4, 5 or 6
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/installation
    verified_at: 2026-09-30

  hosting.runtime_stack:
    value: PHP 8.1+ with MySQL/MariaDB
    note: PostgreSQL is not supported.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/installation
    verified_at: 2026-09-30

  hosting.docker_image:
    value: unverified

  hosting.offline_mode:
    value: unverified

  hosting.mobile_friendly:
    value: unverified

  cost.license_spdx:
    value: GPL-2.0-or-later
    note: Stated as "GNU General Public License v2 or later" in the docs and on the JED listing.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams
    verified_at: 2026-09-30

  cost.price_model:
    value: paid (GPL)
    note: Lowest tier is Developer at 59 EUR, with 1 year of support and updates.
    method: docs
    source_url: https://www.nextsoftware.dev/joomla-extensions/next-exams
    verified_at: 2026-09-30

  cost.source_access:
    value: after purchase
    note: The package is downloaded from the customer account at nextsoftware.dev.
    method: docs
    source_url: https://www.nextsoftware.dev/documentation/next-exams/installation
    verified_at: 2026-09-30
